services:
  # Grafana dev server — mounts our built plugin
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    environment:
      GF_INSTALL_PLUGINS: "grafana-clickhouse-datasource 4.20.0"
      GF_DEFAULT_APP_MODE: development
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_BASIC_ENABLED: "false"
    depends_on:
      - clickhouse

  # ClickHouse — OTel-compatible schema
  clickhouse:
    image: clickhouse/clickhouse-server:26.3-alpine
    ports:
      - "127.0.0.1:8123:8123"   # HTTP interface (used by the datasource plugin)
      - "127.0.0.1:9000:9000"   # Native protocol
    environment:
      # jemalloc: return freed pages to the OS after 1 s instead of the default 5 s, so idle RSS
      # follows the tracked memory more closely (merged with the image's built-in options).
      MALLOC_CONF: "background_thread:true,dirty_decay_ms:1000,muzzy_decay_ms:1000"
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./scripts/clickhouse-init:/docker-entrypoint-initdb.d
      - ./scripts/clickhouse-config/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
    # Dev/e2e cap. low-memory.xml caps the server at 3.5 GiB (steady RSS ~1 GB), so the cap is
    # always below this limit and idle RSS drift cannot lock the server out (see docs/dev/CONTEXT.md).
    mem_limit: 4g
    # A lock-out that still happens is fixed by the healthcheck below ending PID 1.
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # Exit code 241 = MEMORY_LIMIT_EXCEEDED: the server is up but refuses every query. Docker never
      # restarts an unhealthy container by itself, so end PID 1 and let `restart: unless-stopped`
      # bring it back (data is on the volume). Other failures (starting up, refused) just report.
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null; rc=$$?; [ $$rc -eq 241 ] && kill 1; exit $$rc"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  # Ollama — local OpenAI-compatible LLM server, used to test the "Guess with AI" column-mapping
  # assist against a weak/self-hosted model. OLLAMA_ORIGINS=* is required so the Grafana browser
  # frontend (a different origin) can call it directly (frontend-direct calls, no backend proxy).
  # After first `docker compose up`, pull a small model once:
  #   docker compose exec ollama ollama pull qwen2.5:1.5b
  # Then in the plugin's Configuration page → AI Assistant, set:
  #   API base URL: http://localhost:11434/v1   Model: qwen2.5:1.5b   Token: (blank)
  ollama:
    image: ollama/ollama
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_ORIGINS: "*"
    volumes:
      - ollama_data:/root/.ollama

  # OTel collector — receives OTLP and ships to ClickHouse
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./scripts/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse_data:
  ollama_data:
